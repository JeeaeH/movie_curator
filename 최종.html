{q:'마지막 질문입니다. 오늘 몇 명이 함께 가나요?',a:[{t:'🧍 혼자 갑니다',n:1},{t:'👫 2명이 갑니다',n:2},{t:'👨‍👩‍👧 3명이 갑니다',n:3},{t:'🔢 직접 입력',num:1}]}
];
const RES=Q.length+1,SEAT=RES+1,PAY=SEAT+1,DONE=PAY+1;
const SEATNAME={center:'정중앙 명당',aisle:'통로 쪽',front:'스크린 몰입'};
const ROWS='ABCDEFGH',PRICE=14000,MAXN=96;
let st;
function reset(){st={step:0,trail:[],lock:false,theater:LIST[0].n,ti:0,friend:null,copied:false,sc:{emo:0,mind:0,thrill:0,energy:0},seatPref:'center',n:1,rank:[],ri:0,time:null,seats:[],taken:new Set(),pay:null,no:''}}
reset();
const $=document.getElementById('app');
const head='<div class="logo">무비 큐레이터<small>성향으로 고르는 오늘의 영화</small></div>';
function mini(k){const hl={center:[[4,6],[4,7],[5,6],[5,7]],aisle:[[3,4],[4,4]],front:[[1,6],[1,7],[2,6],[2,7]]}[k]||[];let c='';
  for(let r=0;r<8;r++)for(let x=1;x<=12;x++){if(x===4||x===10)c+='<i class="gp"></i>';c+=`<i class="${hl.some(p=>p[0]===r&&p[1]===x)?'ms':'mo'}"></i>`}
  return`<span class="mini"><em></em><span class="mg">${c}</span></span>`}
function choose(i){if(st.lock)return;const q=Q[st.step-1],m=q.a[i].t.match(/^(\S+)/);
  if(q.a[i].num){const el=document.getElementById('ni');let v=Math.round(+(el&&el.value));if(!(v>=1)){if(el){el.value=1;el.focus()}return}if(v>MAXN)v=MAXN;el.value=v;st.n=v}
  st.lock=true;
  document.querySelectorAll('.qc').forEach((c,k)=>c.classList.add(k===i?'sel':'dim'));
  setTimeout(()=>{st.lock=false;st.trail.push(q.a[i].num?String(st.n):(m?m[1]:'✔'));pick(i)},420)}
window.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ni'){if(e.key==='Enter'&&st.step>=1&&st.step<=Q.length&&!st.lock)choose(Q[st.step-1].a.findIndex(a=>a.num));return}if(st.step<1||st.step>Q.length||st.lock)return;const n=Q[st.step-1].a.length;let i=-1;
  if(e.key==='ArrowLeft'&&n===2)i=0;else if(e.key==='ArrowRight'&&n===2)i=1;else if(/^[1-4]$/.test(e.key))i=+e.key-1;
  if(i>=0&&i<n&&!Q[st.step-1].a[i].num)choose(i)});
function go(s){st.step=s;render();window.scrollTo(0,0)}
function pick(i){
  const a=Q[st.step-1].a[i];
  if(a.s)for(const k in a.s)st.sc[k]+=a.s[k];
  if(a.seat)st.seatPref=a.seat;
  if(a.n){st.n=a.n;st.nReq=a.n}if(a.num)st.nReq=st.n;
  if(st.step===Q.length){
    st.rank=MOVIES.filter(m=>!m.only||m.only.includes(st.theater)).map(m=>({m,s:Object.keys(m.w).reduce((x,k)=>x+m.w[k]*st.sc[k],0)})).sort((a,b)=>b.s-a.s).map(r=>r.m);
    st.ri=0;st.time=st.rank[0].times[0];
  }
  go(st.step+1);
}
function topType(){return TYPES[Object.keys(st.sc).sort((a,b)=>st.sc[b]-st.sc[a])[0]]}
function cur(){return st.rank[st.ri]}
function nextMovie(){st.ri=(st.ri+1)%st.rank.length;st.time=cur().times[0];render()}
function setTime(t){st.time=t;render()}
function rnd(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}
function blk(c){return c<=3?0:c<=9?1:2}
function recommend(){
  const T={center:[5,6.5],aisle:[4,4],front:[2,6.5]}[st.seatPref],n=st.n;let best=null,bc=1e9;
  for(let r=0;r<8;r++)for(let c=1;c+n-1<=12;c++){
    let ok=true,cost=0;
    for(let k=0;k<n;k++){const id=ROWS[r]+(c+k);if(st.taken.has(id)||blk(c+k)!==blk(c)){ok=false;break}cost+=Math.abs(r-T[0])*1.5+Math.abs(c+k-T[1])}
    if(ok&&![c-1,c+n].some(k=>k>=1&&k<=12&&blk(k)===blk(c)&&!st.taken.has(ROWS[r]+k)))cost+=4;
    if(ok&&cost<bc){bc=cost;best=Array.from({length:n},(_,k)=>ROWS[r]+(c+k))}
  }
  if(!best){let b2=1e9;for(let r=0;r<8;r++)for(let c=1;c+n-1<=12;c++){let ok=true,cost=0;for(let k=0;k<n;k++){const id=ROWS[r]+(c+k);if(st.taken.has(id)){ok=false;break}cost+=Math.abs(r-T[0])*1.5+Math.abs(c+k-T[1])+(blk(c+k)!==blk(c)?1.5:0)}if(ok&&cost<b2){b2=cost;best=Array.from({length:n},(_,k)=>ROWS[r]+(c+k))}}}
if(!best){const all=[];for(let r=0;r<8;r++)for(let c=1;c<=12;c++){const id=ROWS[r]+c;if(!st.taken.has(id))all.push({id,cost:Math.abs(r-T[0])*1.5+Math.abs(c-T[1])})}all.sort((a,b)=>a.cost-b.cost);best=all.slice(0,n).map(x=>x.id)}
return best;
}
function splitNote(){if(st.n<2||st.seats.length!==st.n)return'';const ss=st.seats.map(id=>({r:id[0],c:+id.slice(1)})).sort((a,b)=>a.r<b.r?-1:a.r>b.r?1:a.c-b.c);const sp=ss.some(x=>x.r!==ss[0].r)||ss.some((x,i)=>i&&x.c!==ss[i-1].c+1);return sp?'<p class="note" style="color:var(--red2);margin:0 0 8px">연속된 자리가 부족해서 떨어진 좌석이 포함되어 있어요.</p>':''}
function adjNote(){return st.adj?`<p class="note" style="color:var(--red2);margin:0 0 8px">남은 좌석이 ${st.adj.to}석이라 ${st.adj.from}명 중 ${st.adj.to}석으로 맞췄어요.</p>`:''}
function toSeats(){
  const R=rnd(cur().id+st.time);st.taken=new Set();
  for(const r of ROWS)for(let c=1;c<=12;c++)if(R()<0.32)st.taken.add(r+c);
  st.n=st.nReq||st.n;st.adj=null;{const fr=ROWS.length*12-st.taken.size;if(st.n>fr){st.adj={from:st.n,to:fr};st.n=fr}}st.seats=recommend();go(SEAT);
}
function togSeat(id){
  if(st.taken.has(id))return;
  const i=st.seats.indexOf(id);
  if(i>=0)st.seats.splice(i,1);else{st.seats.push(id);if(st.seats.length>st.n)st.seats.shift()}
  render();
}
function setPay(p){st.pay=p;render()}
function pay(){st.no='CGV'+Math.floor(10000000+Math.random()*89999999);go(DONE)}
const won=n=>n.toLocaleString('ko-KR')+'원';
function setTheater(t){st.theater=t;render()}
function freeNeighbors(){const out=[];st.seats.forEach(id=>{const r=id[0],c=+id.slice(1);[c-1,c+1].forEach(k=>{const nid=r+k;if(k>=1&&k<=12&&blk(k)===blk(c)&&!st.taken.has(nid)&&!st.seats.includes(nid)&&!out.includes(nid))out.push(nid)})});return out}
function msg(){const m=cur();return `${m.t} 예매했어. 같이 보자!\n${m.d} ${st.time} · ${st.theater}\n내 자리는 ${st.seats.slice().sort().join(', ')}이고, 네 자리는 바로 옆 ${st.friend}야.\n안 오면 팝콘은 내가 다 먹을게.`}
function copyTxt(t){try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t)}catch(e){}return Promise.reject()}
function copyMsg(){copyTxt(msg()).catch(()=>{const a=document.getElementById('msg');if(a){a.select();try{document.execCommand('copy')}catch(e){}}}).finally(()=>{st.copied=true;render()})}
function doShare(){try{navigator.share({text:msg()}).catch(()=>{})}catch(e){copyMsg()}}
function setFriend(id){st.friend=id;st.copied=false;render()}
function jump(r){const i=LIST.findIndex(x=>x.r===r);document.getElementById('wheel').scrollTo({top:i*44,behavior:'smooth'})}
function bindWheel(){
  const w=document.getElementById('wheel');if(!w)return;
  const its=w.querySelectorAll('.wi');let dr=null,moved=false;
  const upd=()=>{const i=Math.max(0,Math.min(LIST.length-1,Math.round(w.scrollTop/44)));st.ti=i;st.theater=LIST[i].n;
    const o=w.querySelector('.on');if(o)o.classList.remove('on');its[i].classList.add('on');
    document.querySelectorAll('.rg').forEach(e=>e.classList.toggle('on',e.dataset.r===LIST[i].r));
    const b=document.getElementById('go1');if(b)b.textContent=st.theater+'에서 시작하기'};
  w.scrollTop=st.ti*44;upd();
  w.addEventListener('scroll',upd);
  w.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dr={y:e.clientY,s:w.scrollTop};moved=false;w.classList.add('drag')});
  w.addEventListener('pointermove',e=>{if(!dr)return;const dy=e.clientY-dr.y;if(Math.abs(dy)>4)moved=true;w.scrollTop=dr.s-dy});
  const end=()=>{if(!dr)return;dr=null;w.classList.remove('drag');w.scrollTo({top:Math.round(w.scrollTop/44)*44,behavior:'smooth'})};
  w.addEventListener('pointerup',end);w.addEventListener('pointerleave',end);
  w.addEventListener('click',e=>{if(moved){moved=false;return}const it=e.target.closest('.wi');if(it)w.scrollTo({top:it.dataset.i*44,behavior:'smooth'})});
}

    h+=`<button class="btn ghost" onclick="reset();go(0)">처음부터 다시 해보기</button>`;
  }
  $.innerHTML=h;if(s===0)bindWheel();
}
render();
</script>
</body>
